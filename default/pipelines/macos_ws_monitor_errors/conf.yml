output: default
streamtags: []
groups: {}
asyncFuncTimeout: 1000
description: >-
  WindowServer monitor error log lines. Stamps index mac_perf and sourcetype
  ws-monitor:err.
functions:
  - id: eval
    filter: "true"
    disabled: false
    conf:
      add:
        - name: index
          value: "'mac_perf'"
        - name: sourcetype
          value: "'ws-monitor:err'"
